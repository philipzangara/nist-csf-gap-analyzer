GV:
  name: GOVERN
  categories:
    GV.OC:
      name: Organizational Context
      subcategories:
        GV.OC-01:
          description: The organizational mission is understood and informs cybersecurity risk management
        GV.OC-02:
          description: Internal and external stakeholders are understood, and their needs and expectations
            regarding cybersecurity risk management are understood and considered
        GV.OC-03:
          description: Legal, regulatory, and contractual requirements regarding cybersecurity - including
            privacy and civil liberties obligations - are understood and managed
        GV.OC-04:
          description: Critical objectives, capabilities, and services that external stakeholders depend
            on or expect from the organization are understood and communicated
        GV.OC-05:
          description: Outcomes, capabilities, and services that the organization depends on are understood
            and communicated
    GV.RM:
      name: Risk Management Strategy
      subcategories:
        GV.RM-01:
          description: Risk management objectives are established and agreed to by organizational stakeholders
        GV.RM-02:
          description: Risk appetite and risk tolerance statements are established, communicated, and
            maintained
        GV.RM-03:
          description: Cybersecurity risk management activities and outcomes are included in enterprise
            risk management processes
        GV.RM-04:
          description: Strategic direction that describes appropriate risk response options is established
            and communicated
        GV.RM-05:
          description: Lines of communication across the organization are established for cybersecurity
            risks, including risks from suppliers and other third parties
        GV.RM-06:
          description: A standardized method for calculating, documenting, categorizing, and prioritizing
            cybersecurity risks is established and communicated
        GV.RM-07:
          description: Strategic opportunities (i.e., positive risks) are characterized and are included
            in organizational cybersecurity risk discussions
    GV.RR:
      name: Roles, Responsibilities, and Authorities
      subcategories:
        GV.RR-01:
          description: Organizational leadership is responsible and accountable for cybersecurity risk
            and fosters a culture that is risk-aware, ethical, and continually improving
        GV.RR-02:
          description: Roles, responsibilities, and authorities related to cybersecurity risk management
            are established, communicated, understood, and enforced
        GV.RR-03:
          description: Adequate resources are allocated commensurate with the cybersecurity risk strategy,
            roles, responsibilities, and policies
        GV.RR-04:
          description: Cybersecurity is included in human resources practices
    GV.PO:
      name: Policy
      subcategories:
        GV.PO-01:
          description: Policy for managing cybersecurity risks is established based on organizational
            context, cybersecurity strategy, and priorities and is communicated and enforced
        GV.PO-02:
          description: Policy for managing cybersecurity risks is reviewed, updated, communicated, and
            enforced to reflect changes in requirements, threats, technology, and organizational mission
    GV.OV:
      name: Oversight
      subcategories:
        GV.OV-01:
          description: Cybersecurity risk management strategy outcomes are reviewed to inform and adjust
            strategy and direction
        GV.OV-02:
          description: The cybersecurity risk management strategy is reviewed and adjusted to ensure coverage
            of organizational requirements and risks
        GV.OV-03:
          description: Organizational cybersecurity risk management performance is evaluated and reviewed
            for adjustments needed
    GV.SC:
      name: Cybersecurity Supply Chain Risk Management
      subcategories:
        GV.SC-01:
          description: A cybersecurity supply chain risk management program, strategy, objectives, policies,
            and processes are established and agreed to by organizational stakeholders
        GV.SC-02:
          description: Cybersecurity roles and responsibilities for suppliers, customers, and partners
            are established, communicated, and coordinated internally and externally
        GV.SC-03:
          description: Cybersecurity supply chain risk management is integrated into cybersecurity and
            enterprise risk management, risk assessment, and improvement processes
        GV.SC-04:
          description: Suppliers are known and prioritized by criticality
        GV.SC-05:
          description: Requirements to address cybersecurity risks in supply chains are established, prioritized,
            and integrated into contracts and other types of agreements with suppliers and other relevant
            third parties
        GV.SC-06:
          description: Planning and due diligence are performed to reduce risks before entering into formal
            supplier or other third-party relationships
        GV.SC-07:
          description: The risks posed by a supplier, their products and services, and other third parties
            are understood, recorded, prioritized, assessed, responded to, and monitored over the course
            of the relationship
        GV.SC-08:
          description: Relevant suppliers and other third parties are included in incident planning, response,
            and recovery activities
        GV.SC-09:
          description: Supply chain security practices are integrated into cybersecurity and enterprise
            risk management programs, and their performance is monitored throughout the technology product
            and service life cycle
        GV.SC-10:
          description: Cybersecurity supply chain risk management plans include provisions for activities
            that occur after the conclusion of a partnership or service agreement
ID:
  name: IDENTIFY
  categories:
    ID.AM:
      name: Asset Management
      subcategories:
        ID.AM-01:
          description: Inventories of hardware managed by the organization are maintained
        ID.AM-02:
          description: Inventories of software, services, and systems managed by the organization are
            maintained
        ID.AM-03:
          description: Representations of the organization's authorized network communication and internal
            and external network data flows are maintained
        ID.AM-04:
          description: Inventories of services provided by suppliers are maintained
        ID.AM-05:
          description: Assets are prioritized based on classification, criticality, resources, and impact
            on the mission
        ID.AM-07:
          description: Inventories of data and corresponding metadata for designated data types are maintained
        ID.AM-08:
          description: Systems, hardware, software, services, and data are managed throughout their life
            cycles
    ID.RA:
      name: Risk Assessment
      subcategories:
        ID.RA-01:
          description: Vulnerabilities in assets are identified, validated, and recorded
        ID.RA-02:
          description: Cyber threat intelligence is received from information sharing forums and sources
        ID.RA-03:
          description: Internal and external threats to the organization are identified and recorded
        ID.RA-04:
          description: Potential impacts and likelihoods of threats exploiting vulnerabilities are identified
            and recorded
        ID.RA-05:
          description: Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent
            risk and inform risk response prioritization
        ID.RA-06:
          description: Risk responses are chosen, prioritized, planned, tracked, and communicated
        ID.RA-07:
          description: Changes and exceptions are managed, assessed for risk impact, recorded, and tracked
        ID.RA-08:
          description: Processes for receiving, analyzing, and responding to vulnerability disclosures
            are established
        ID.RA-09:
          description: The authenticity and integrity of hardware and software are assessed prior to acquisition
            and use
        ID.RA-10:
          description: Critical suppliers are assessed prior to acquisition
    ID.IM:
      name: Improvement
      subcategories:
        ID.IM-01:
          description: Improvements are identified from evaluations
        ID.IM-02:
          description: Improvements are identified from security tests and exercises, including those
            done in coordination with suppliers and relevant third parties
        ID.IM-03:
          description: Improvements are identified from execution of operational processes, procedures,
            and activities
        ID.IM-04:
          description: Incident response plans and other cybersecurity plans that affect operations are
            established, communicated, maintained, and improved
PR:
  name: PROTECT
  categories:
    PR.AA:
      name: Identity Management, Authentication, and Access Control
      subcategories:
        PR.AA-01:
          description: Identities and credentials for authorized users, services, and hardware are managed
            by the organization
        PR.AA-02:
          description: Identities are proofed and bound to credentials based on the context of interactions
        PR.AA-03:
          description: Users, services, and hardware are authenticated
        PR.AA-04:
          description: Identity assertions are protected, conveyed, and verified
        PR.AA-05:
          description: Access permissions, entitlements, and authorizations are defined in a policy, managed,
            enforced, and reviewed, and incorporate the principles of least privilege and separation of
            duties
        PR.AA-06:
          description: Physical access to assets is managed, monitored, and enforced commensurate with
            risk
    PR.AT:
      name: Awareness and Training
      subcategories:
        PR.AT-01:
          description: Personnel are provided with awareness and training so that they possess the knowledge
            and skills to perform general tasks with cybersecurity risks in mind
        PR.AT-02:
          description: Individuals in specialized roles are provided with awareness and training so that
            they possess the knowledge and skills to perform relevant tasks with cybersecurity risks in
            mind
    PR.DS:
      name: Data Security
      subcategories:
        PR.DS-01:
          description: The confidentiality, integrity, and availability of data-at-rest are protected
        PR.DS-02:
          description: The confidentiality, integrity, and availability of data-in-transit are protected
        PR.DS-10:
          description: The confidentiality, integrity, and availability of data-in-use are protected
        PR.DS-11:
          description: Backups of data are created, protected, maintained, and tested
    PR.PS:
      name: Platform Security
      subcategories:
        PR.PS-01:
          description: Configuration management practices are established and applied
        PR.PS-02:
          description: Software is maintained, replaced, and removed commensurate with risk
        PR.PS-03:
          description: Hardware is maintained, replaced, and removed commensurate with risk
        PR.PS-04:
          description: Log records are generated and made available for continuous monitoring
        PR.PS-05:
          description: Installation and execution of unauthorized software are prevented
        PR.PS-06:
          description: Secure software development practices are integrated, and their performance is
            monitored throughout the software development life cycle
    PR.IR:
      name: Technology Infrastructure Resilience
      subcategories:
        PR.IR-01:
          description: Networks and environments are protected from unauthorized logical access and usage
        PR.IR-02:
          description: The organization's technology assets are protected from environmental threats
        PR.IR-03:
          description: Mechanisms are implemented to achieve resilience requirements in normal and adverse
            situations
        PR.IR-04:
          description: Adequate resource capacity to ensure availability is maintained
DE:
  name: DETECT
  categories:
    DE.CM:
      name: Continuous Monitoring
      subcategories:
        DE.CM-01:
          description: Networks and network services are monitored to find potentially adverse events
        DE.CM-02:
          description: The physical environment is monitored to find potentially adverse events
        DE.CM-03:
          description: Personnel activity and technology usage are monitored to find potentially adverse
            events
        DE.CM-06:
          description: External service provider activities and services are monitored to find potentially
            adverse events
        DE.CM-09:
          description: Computing hardware and software, runtime environments, and their data are monitored
            to find potentially adverse events
    DE.AE:
      name: Adverse Event Analysis
      subcategories:
        DE.AE-02:
          description: Potentially adverse events are analyzed to better understand associated activities
        DE.AE-03:
          description: Information is correlated from multiple sources
        DE.AE-04:
          description: The estimated impact and scope of adverse events are understood
        DE.AE-06:
          description: Information on adverse events is provided to authorized staff and tools
        DE.AE-07:
          description: Cyber threat intelligence and other contextual information are integrated into
            the analysis
        DE.AE-08:
          description: Incidents are declared when adverse events meet the defined incident criteria
RS:
  name: RESPOND
  categories:
    RS.MA:
      name: Incident Management
      subcategories:
        RS.MA-01:
          description: The incident response plan is executed in coordination with relevant third parties
            once an incident is declared
        RS.MA-02:
          description: Incident reports are triaged and validated
        RS.MA-03:
          description: Incidents are categorized and prioritized
        RS.MA-04:
          description: Incidents are escalated or elevated as needed
        RS.MA-05:
          description: The criteria for initiating incident recovery are applied
    RS.AN:
      name: Incident Analysis
      subcategories:
        RS.AN-03:
          description: Analysis is performed to establish what has taken place during an incident and
            the root cause of the incident
        RS.AN-06:
          description: Actions performed during an investigation are recorded, and the records' integrity
            and provenance are preserved
        RS.AN-07:
          description: Incident data and metadata are collected, and their integrity and provenance are
            preserved
        RS.AN-08:
          description: An incident's magnitude is estimated and validated
    RS.CO:
      name: Incident Response Reporting and Communication
      subcategories:
        RS.CO-02:
          description: Internal and external stakeholders are notified of incidents
        RS.CO-03:
          description: Information is shared with designated internal and external stakeholders
    RS.MI:
      name: Incident Mitigation
      subcategories:
        RS.MI-01:
          description: Incidents are contained
        RS.MI-02:
          description: Incidents are eradicated
RC:
  name: RECOVER
  categories:
    RC.RP:
      name: Incident Recovery Plan Execution
      subcategories:
        RC.RP-01:
          description: The recovery portion of the incident response plan is executed once initiated from
            the incident response process
        RC.RP-02:
          description: Recovery actions are selected, scoped, prioritized, and performed
        RC.RP-03:
          description: The integrity of backups and other restoration assets is verified before using
            them for restoration
        RC.RP-04:
          description: Critical mission functions and cybersecurity risk management are considered to
            establish post-incident operational norms
        RC.RP-05:
          description: The integrity of restored assets is verified, systems and services are restored,
            and normal operating status is confirmed
        RC.RP-06:
          description: The end of incident recovery is declared based on criteria, and incident-related
            documentation is completed
    RC.CO:
      name: Incident Recovery Communication
      subcategories:
        RC.CO-03:
          description: Recovery activities and progress in restoring operational capabilities are communicated
            to designated internal and external stakeholders
        RC.CO-04:
          description: Public updates on incident recovery are shared using approved methods and messaging
