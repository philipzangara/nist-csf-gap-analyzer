# Test fixture assessment — designed to exercise gap_engine.py, not to
# represent a specific real business (see the earlier "Coastal Ridge
# Dental" sample for a business-narrative version).
#
# Deliberately mixed on purpose:
# - GV.OC and PR.AT: fully implemented (100% coverage) — tests that a
#   Category can hit 100% and that Function coverage reflects it.
# - ID.RA and DE.CM: mixed implemented/partial/not_implemented — tests
#   the partial-count-separate-from-percentage logic.
# - RS.MI and every other category NOT listed here at all: tests the
#   locked-in default that a subcategory (or entire category) absent
#   from the assessment file is treated as not_implemented.
#
# All subcategory IDs below are real (from data/csf_2_0_reference.yaml).

